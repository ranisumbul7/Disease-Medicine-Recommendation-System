<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password | Health Center</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{
    font-family:'Poppins',sans-serif;
    margin:0;
    background: linear-gradient(135deg,#6a11cb,#2575fc);
    height:100vh;
    display:flex;
    flex-direction:column;
    background-repeat:no-repeat;
    background-size:cover;
}
.full-page-center{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}
.auth-card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(8px);
    padding:2rem;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
    max-width:420px;
    width:90%;
    color:#fff;
}
.input-group-text{
    background:transparent;
    border:none;
    color:#fff;
}
.form-control{
    background:rgba(255,255,255,0.2);
    border:none;
    color:#fff;
}
.form-control:focus{
    box-shadow:none;
    background:rgba(255,255,255,0.3);
}
.btn-login{
    background:#6a11cb;
    color:#fff;
    font-weight:600;
    border-radius:12px;
    padding:10px;
    transition:0.3s;
}
.btn-login:hover{
    background:#2575fc;
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
}
.text-light small a{color:#fff;}
</style>
</head>
<body>
<nav class="navbar navbar-dark px-4" style="background:transparent !important;">
<div class="container">
<a class="navbar-brand fw-bold" href="/">Health Center</a>
</div>
</nav>

<div class="full-page-center">
<div class="auth-card">
<h2 class="text-center mb-4">Reset Password</h2>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}
<div class="alert alert-{{ category }}">{{ message }}</div>
{% endfor %}
{% endif %}
{% endwith %}
<form method="POST" action="{{ url_for('forgot_password') }}">
<div class="input-group mb-3">
<input type="email" name="email" class="form-control" placeholder="Email address" required>
<span class="input-group-text"><i class="bi bi-envelope"></i></span>
</div>
<div class="input-group mb-3">
<input type="password" name="password" class="form-control" placeholder="New Password" required>
<span class="input-group-text"><i class="bi bi-lock"></i></span>
</div>
<div class="input-group mb-3">
<input type="password" name="confirm" class="form-control" placeholder="Confirm New Password" required>
<span class="input-group-text"><i class="bi bi-lock"></i></span>
</div>
<button type="submit" class="btn-login w-100">Reset Password</button>
</form>
<p class="mt-3 text-center text-light small">
Remembered your password? <a href="{{ url_for('login') }}" class="text-decoration-underline">Login</a>
</p>
</div>
</div>

<script>
function togglePassword() {
    const pw = document.getElementById('password');
    const conf = document.getElementById('confirm');
    if(pw) pw.type = pw.type === 'password' ? 'text' : 'password';
    if(conf) conf.type = conf.type === 'password' ? 'text' : 'password';
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
