<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .card {
            border-radius: 15px;
        }
        .ai-btn {
    display: inline-block;
    padding: 12px 20px;
    background: linear-gradient(135deg, #00796b, #00acc1);
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
    transition: 0.3s ease;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

.ai-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}
.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
    width: 300px;
}
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand mb-0 h1">Healthcare Dashboard</span>

    <!-- Logout -->
    <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow p-4 text-center">
                <h2 class="mb-3">Welcome</h2>
                <p class="text-muted">You have successfully logged in.</p>

                <hr>

                <div class="d-grid gap-3">
                    <a href="/healthcare" class="btn btn-primary">
                        Go to Disease Prediction
                    </a>

                    <a href="/" class="btn btn-secondary">
                        Back to Home
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- ai-doctor call -->
<div class="card">
    <h3>AI Doctor Consultation</h3>
    <a href="/ai-doctor" class="ai-btn">Start Consultation</a>
</div>




</body>
</html>
