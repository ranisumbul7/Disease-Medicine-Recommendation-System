<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Healthcare Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            min-height: 100vh;
        }

        .navbar {
            backdrop-filter: blur(10px);
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transition: 0.3s ease;
        }

        .main-card:hover {
            transform: translateY(-5px);
        }

        .btn-custom {
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            transition: 0.3s ease;
        }

        .btn-custom:hover {
            transform: translateY(-3px);
        }

        .ai-section {
            margin-top: 40px;
            text-align: center;
        }

        .ai-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: inline-block;
            transition: 0.3s ease;
        }

        .ai-card:hover {
            transform: scale(1.05);
        }

        .ai-btn {
            display: inline-block;
            padding: 12px 20px;
            background: linear-gradient(135deg, #00796b, #00acc1);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s ease;
            margin-top: 10px;
        }

        .ai-btn:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-bold">🏥 Healthcare Dashboard</span>
    <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-7">
        <div class="main-card text-center">
            <h2 class="mb-3 fw-bold">Welcome Back 👋</h2>
            <p class="text-muted">You have successfully logged into your healthcare system.</p>

            <hr>

            <div class="d-grid gap-3 mt-4">
                <a href="/healthcare" class="btn btn-primary btn-custom">
                    🧠 Disease Prediction
                </a>

                <a href="/" class="btn btn-secondary btn-custom">
                    🏠 Back to Home
                </a>
            </div>
        </div>

        <!-- AI Doctor Section -->
        <div class="ai-section">
            <div class="ai-card">
                <h4 class="fw-bold">🤖 AI Doctor Consultation</h4>
                <p class="text-muted">Get instant medical guidance powered by AI.</p>
                <a href="/ai-doctor" class="ai-btn">Start Consultation</a>
            </div>
        </div>

    </div>
</div>

</body>
</html>
