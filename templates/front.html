<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Healthcare Home</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{
    font-family:'Poppins',sans-serif;
    margin:0;
    background: linear-gradient(135deg,#6a11cb,#2575fc);
    height:100vh;
    display:flex;
    flex-direction:column;
    background-repeat:no-repeat;
    background-size:cover;
}
.navbar{background:transparent !important;}
.full-page-center{flex:1;display:flex;justify-content:center;align-items:center;}
.auth-card{background:rgba(255,255,255,0.15);backdrop-filter:blur(8px);padding:2rem;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,0.25);max-width:500px;width:90%;color:#fff;}
.btn-login{background:#fff;color:#6a11cb;font-weight:600;border-radius:12px;padding:10px;transition:0.3s;}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.2);}
.btn-register{background:#fff;color:#6a11cb;font-weight:600;border-radius:12px;padding:10px;transition:0.3s;}
.btn-register:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.2);}
footer{ text-align:center; padding:10px; color:#fff;}
</style>

</head>

<body>

<nav class="navbar navbar-dark px-4">
<div class="container">
<a class="navbar-brand fw-bold" href="/">Health Center</a>
{% if session.get('user_id') %}
<a class="btn btn-outline-light btn-sm ms-auto" href="{{ url_for('logout') }}">Logout</a>
{% endif %}
</div>
</nav>

<div class="full-page-center">
<div class="auth-card text-center">

<h2 class="fw-bold mb-3">Welcome</h2>

<div class="d-grid gap-3 col-8 mx-auto">
<a href="{{ url_for('login') }}" class="btn-login">Login</a>
<a href="{{ url_for('register') }}" class="btn-register">Register</a>
</div>

</div>
</div>

<footer>
© 2026 Healthcare System
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
