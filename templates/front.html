<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: url("/static/healthcare-clinic.jpg") no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            padding: 50px;
            border-radius: 20px;
            text-align: center;
        }

        .overlay h1 {
            color: black;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .btn-health {
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 30px;
        }
    </style>
</head>

<body>

    <div class="overlay">
        <h1>Welcome to Health Care Center</h1>
        <a href="/healthcare" class="btn btn-danger btn-health">
            Go to HealthCare Centre
        </a>
        
        
    </div>

</body>
</html>
