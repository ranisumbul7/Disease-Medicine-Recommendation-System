<!DOCTYPE html>
<html>
<head>
    <title>AI Doctor Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/ai_doctor.css') }}">

</head>

<body>

<div class="header">
    🤖 AI Doctor Assistant
</div>

<div class="chat-container" id="chat"></div>

<div class="input-area">
    <textarea id="userInput" rows="1" placeholder="Describe your symptoms..."></textarea>
    <button onclick="sendMessage()">Send</button>
    <button onclick="startVoice()" id="voiceBtn" style="margin-right:10px;">🎙</button>
</div>

<div class="disclaimer">
    Disclaimer: This AI provides general medical information only and is not a licensed doctor.
</div>

<div class="container mt-3">
    <button onclick="goBack()" class="btn-back">
        ← Go Back
    </button>
</div>


<script>

    //  Start Voice
    function startVoice() {

        if (!('webkitSpeechRecognition' in window)) {
            alert("Use Google Chrome for voice feature.");
            return;
        }

        const recognition = new webkitSpeechRecognition();
        recognition.lang = "en-US";
        recognition.continuous = false;
        recognition.interimResults = false;

        const voiceBtn = document.getElementById("voiceBtn");
        voiceBtn.innerText = "Listening... ";

        recognition.start();

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById("userInput").value = transcript;

            sendMessage();
        };

        recognition.onend = function() {
            voiceBtn.innerText = "speak";
        };
    }


    //  Send Message
    function sendMessage() {

        const input = document.getElementById("userInput");
        const message = input.value.trim();
        if (!message) return;

        const chat = document.getElementById("chat");

        // 👤 User Bubble
        const userMsg = document.createElement("div");
        userMsg.className = "message user";
        userMsg.innerText = message;
        chat.appendChild(userMsg);

        input.value = "";

        fetch("/ask", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: message})
        })
        .then(res => res.json())
        .then(data => {

            // AI Bubble
            const aiMsg = document.createElement("div");
            aiMsg.className = "message ai";
            aiMsg.innerText = data.reply;
            chat.appendChild(aiMsg);
            chat.scrollTop = chat.scrollHeight;

            // AI Voice Reply
            speakText(data.reply);
        });
    }


    // Text To Speech
    function speakText(text) {

        const speech = new SpeechSynthesisUtterance();
        speech.text = text;
        speech.lang = "en-US";
        speech.rate = 1;
        speech.pitch = 1;

        window.speechSynthesis.speak(speech);
    }
// Back button functionality
function goBack() {
    window.history.back();
}

</script>


</body>
</html>
