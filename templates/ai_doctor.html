<!DOCTYPE html>
<html>
<head>
    <title>AI Doctor</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #ece5dd;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Main chat box */
.chat-container {
    width: 400px;
    height: 600px;
    background: #fff;
    display: flex;
    flex-direction: column;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* Header */
.chat-header {
    background: #075e54;
    color: white;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
}

/* Chat messages area */
.chatbox {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

/* User message */
.user-message {
    align-self: flex-end;
    background: #dcf8c6;
    padding: 8px 12px;
    border-radius: 10px;
    margin: 5px 0;
    max-width: 70%;
}

/* Bot message */
.bot-message {
    align-self: flex-start;
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 10px;
    margin: 5px 0;
    max-width: 70%;
    border: 1px solid #ddd;
}

/* Input area */
.input-area {
    display: flex;
    padding: 10px;
    background: #f0f0f0;
}

.input-area input {
    flex: 1;
    padding: 8px;
    border-radius: 20px;
    border: 1px solid #ccc;
    outline: none;
}

.input-area button {
    margin-left: 5px;
    padding: 8px 12px;
    border: none;
    border-radius: 50%;
    background: #25d366;
    color: white;
    cursor: pointer;
}

.input-area button:hover {
    opacity: 0.8;
}

</style>

</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        AI Doctor
    </div>

    <div id="chatbox" class="chatbox"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your problem...">
        <button onclick="sendMessage()">Send</button>
        <button onclick="startListening()">speak</button>
    </div>
</div>
<script>
function sendMessage() {
    let message = document.getElementById("userInput").value;

    fetch("/ai-response", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: message})
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("chatbox").innerHTML += "<p><b>You:</b> " + message + "</p>";
        document.getElementById("chatbox").innerHTML += "<p><b>Doctor:</b> " + data.reply + "</p>";

        speak(data.reply);
    });
}

function startListening() {
    let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-US";

    recognition.onresult = function(event) {
        let speechText = event.results[0][0].transcript;
        document.getElementById("userInput").value = speechText;
        sendMessage();
    };

    recognition.start();
}

function speak(text) {
    let speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
