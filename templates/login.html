<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Health Center</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
    font-family:'Poppins',sans-serif;
    margin:0;
    background: linear-gradient(135deg,#6a11cb,#2575fc);
    height:100vh;
    display:flex;
    flex-direction:column;
    background-repeat:no-repeat;
    background-size:cover;
}

/* Center Layout */
.full-page-center{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Auth card */
.auth-card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(8px);
    padding:2rem;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
    max-width:400px;
    width:90%;
    color:#fff;
}

.auth-card h2{
    font-weight:600;
}

.input-group-text{
    background:transparent;
    border:none;
    color:#fff;
}

.form-control{
    background:rgba(255,255,255,0.2);
    border:none;
    color:#fff;
}

.form-control:focus{
    box-shadow:none;
    background:rgba(255,255,255,0.3);
}

.btn-login{
    background:#fff;
    color:#6a11cb;
    font-weight:600;
    border-radius:12px;
    padding:10px;
    transition:0.3s;
}
.btn-login:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
}

.text-light small a{
    color:#fff;
}
</style>

</head>

<body>

<nav class="navbar navbar-dark px-4" style="background:transparent !important;">
<div class="container">
<a class="navbar-brand fw-bold" href="/">Health Center</a>
{% if session.get('user_id') %}
<a class="btn btn-outline-light btn-sm ms-auto" href="{{ url_for('logout') }}">Logout</a>
{% endif %}
</div>
</nav>

<div class="full-page-center">
<div class="auth-card">

<h2 class="text-center mb-4">Login</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}
<div class="alert alert-{{ category }}">{{ message }}</div>
{% endfor %}
{% endif %}
{% endwith %}

<form method="POST" action="{{ url_for('login') }}">
<div class="input-group mb-3">
<input type="email" name="email" class="form-control" placeholder="Username" required>
<span class="input-group-text"><i class="bi bi-person"></i></span>
</div>

<div class="input-group mb-3">
<input type="password" name="password" class="form-control" placeholder="Password" required>
<span class="input-group-text"><i class="bi bi-lock"></i></span>
</div>

<div class="d-flex justify-content-between align-items-center mb-3">
<div class="form-check">
<input class="form-check-input" type="checkbox" id="remember" name="remember">
<label class="form-check-label" for="remember">Remember me</label>
</div>
<a href="{{ url_for('forgot_password') }}" class="text-light small">Forgot password?</a>
</div>

<button type="submit" class="btn-login w-100">Login</button>
</form>

<p class="mt-3 text-center text-light small">
Don't have an account? <a href="{{ url_for('register') }}" class="text-decoration-underline">Register</a>
</p>

</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
